name: Validate

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: abud
          POSTGRES_PASSWORD: abud
          POSTGRES_DB: abud_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://abud:abud@localhost:5432/abud_test?schema=public
      RUN_DATABASE_TESTS: "true"
      FLIGHT_PROVIDER: simulator
      COOKIE_SECURE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
